meta:
  author: "Security Engineer"
  description: "Open Redirect Attack Tests"
  enabled: true
  name: "946-open-redirect.yaml"
tests:
  - test_id: 946100
    desc: "Basic open redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://evil.com"
        output:
          log_contains: "http://evil.com"
  - test_id: 946101
    desc: "Protocol-relative redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/login?next=//evil.com"
        output:
          log_contains: "//evil.com"
  - test_id: 946102
    desc: "URL encoded redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/out?link=%2F%2Fevil.com"
        output:
          log_contains: "%2F%2Fevil.com"
  - test_id: 946103
    desc: "Backslash redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/go?to=\\\\evil.com"
        output:
          log_contains: "\\\\evil.com"
  - test_id: 946104
    desc: "Tab in redirect bypass"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=%09http://evil.com"
        output:
          log_contains: "%09http"
  - test_id: 946105
    desc: "Newline in redirect bypass"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=%0ahttp://evil.com"
        output:
          log_contains: "%0ahttp"
  - test_id: 946106
    desc: "At-sign bypass"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://good.com@evil.com"
        output:
          log_contains: "@evil.com"
  - test_id: 946107
    desc: "Unicode domain bypass"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://%E2%93%94%E2%93%A5%E2%93%98%E2%93%9B.%E2%93%92%E2%93%9E%E2%93%9C"
        output:
          log_contains: "%E2%93%94"
  - test_id: 946108
    desc: "JavaScript protocol redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=javascript:alert(1)"
        output:
          log_contains: "javascript:"
  - test_id: 946109
    desc: "Data URI redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=data:text/html,<script>alert(1)</script>"
        output:
          log_contains: "data:text/html"
  - test_id: 946110
    desc: "Meta refresh redirect via data URI"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=data:text/html,<meta%20http-equiv=\"refresh\"%20content=\"0;url=http://evil.com\">"
        output:
          log_contains: "http-equiv"
  - test_id: 946111
    desc: "Double URL encoding open redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=%2568%2574%2574%2570%253a%252f%252f%2565%2576%2569%256c%252e%2563%256f%256d"
        output:
          log_contains: "%2568"
  - test_id: 946112
    desc: "Null byte before domain"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=%00http://evil.com"
        output:
          log_contains: "%00http"
  - test_id: 946113
    desc: "Fragment bypass"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://evil.com#@good.com"
        output:
          log_contains: "#@good.com"
  - test_id: 946114
    desc: "Path confusion bypass"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://good.com.evil.com"
        output:
          log_contains: "good.com.evil.com"
  - test_id: 946115
    desc: "Parameter pollution open redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://good.com&url=http://evil.com"
        output:
          log_contains: "&url="
  - test_id: 946116
    desc: "IP address redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://167772161"
        output:
          log_contains: "167772161"
  - test_id: 946117
    desc: "Hex IP address redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://0x0a000001"
        output:
          log_contains: "0x0a000001"
  - test_id: 946118
    desc: "Octal IP address redirect"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=http://012.000.000.001"
        output:
          log_contains: "012.000.000.001"
  - test_id: 946119
    desc: "Mixed encoding bypass"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/redirect?url=h%74tp://evil.c%6fm"
        output:
          log_contains: "h%74tp"
