---
meta:
  author: "Security Engineer"
  description: "Comprehensive XSS tests for WAF"
  enabled: true
  name: "941-xss-comprehensive"
tests:
  - test_id: 941100
    desc: Basic reflected XSS
    stages:
      - input:
          dest_addr: 127.0.0.1
          method: GET
          port: 80
          uri: /?q=<script>alert(1)</script>
          headers:
            Host: localhost
        output:
          log_contains: "id \"941\""
  - test_id: 941101
    desc: IMG tag with onerror
    stages:
      - input:
          dest_addr: 127.0.0.1
          method: GET
          port: 80
          uri: /?q=<img src=x onerror=alert(1)>
          headers:
            Host: localhost
        output:
          log_contains: "id \"941\""
  - test_id: 941102
    desc: SVG-based XSS
    stages:
