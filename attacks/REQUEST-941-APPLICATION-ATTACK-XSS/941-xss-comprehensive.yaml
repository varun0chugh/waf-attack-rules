          log_contains: "id \"941\""
  - test_id: 941116
    desc: Polyglot XSS payloads
    stages:
      - input:
          dest_addr: 127.0.0.1
          method: GET
          port: 80
          uri: /?q=javascript:/*--></title></style></textarea></script></xmp><svg/onload='+/"/+/onmouseover=1/+/[*/[]/+alert(1)//'>
          headers:
            Host: localhost
        output:
          log_contains: "id \"941\""
