meta:
  author: "Security Engineer"
  description: "SSTI Attack Detection Tests"
  enabled: true
  name: "935-ssti.yaml"
tests:
  - test_id: 935100
    desc: "Jinja2 SSTI math eval"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/search?q={{7*7}}"
        output:
          log_contains: "{{"
  - test_id: 935101
    desc: "Jinja2 SSTI config access"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "POST"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
            Content-Type: "application/x-www-form-urlencoded"
          uri: "/template"
          data: "tpl={{config}}"
        output:
          log_contains: "config"
  - test_id: 935102
    desc: "Jinja2 SSTI RCE via request.application.__globals__"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/view?t={{request.application.__globals__.__builtins__.__import__('os').popen('id').read()}}"
        output:
          log_contains: "__globals__"
  - test_id: 935103
    desc: "Twig SSTI RCE via _self.env.registerUndefinedFilterCallback"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "POST"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
            Content-Type: "application/json"
          uri: "/render"
          data: '{"tpl":"{{_self.env.registerUndefinedFilterCallback(\"exec\")}}{{_self.env.getFilter(\"id\")}}"}'
        output:
          log_contains: "registerUndefinedFilterCallback"
  - test_id: 935104
    desc: "Freemarker SSTI via Execute"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/search?q=<#assign ex=\"freemarker.template.utility.Execute\"?new()>${ex(\"id\")}"
        output:
          log_contains: "freemarker.template.utility.Execute"
  - test_id: 935105
    desc: "Velocity SSTI java.lang.Runtime"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "POST"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
            Content-Type: "application/x-www-form-urlencoded"
          uri: "/velocity"
          data: "tmpl=#set($x='')+#set($rt=$x.class.forName('java.lang.Runtime'))+#set($chr=$x.class.forName('java.lang.Character'))"
        output:
          log_contains: "java.lang.Runtime"
  - test_id: 935106
    desc: "Mako SSTI os.popen"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "GET"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
          uri: "/mako?t=${%22os%22.popen(%22id%22).read()}"
        output:
          log_contains: "os.popen"
  - test_id: 935107
    desc: "Smarty SSTI RCE"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          method: "POST"
          port: 80
          headers:
            User-Agent: "Mozilla/5.0"
            Host: "localhost"
            Content-Type: "application/x-www-form-urlencoded"
          uri: "/smarty"
          data: "tpl={php}echo id;{/php}"
        output:
