          data: '{"tpl":"{{#with \"s\" as |string|}}{{#with string.constructor.prototype as |proto|}}{{proto.hasOwnProperty(\"constructor\")}}{{/with}}{{/with}}"}'
        output:
          log_contains: "constructor.prototype"
  - test_id: 935110
    desc: "ERB/Ruby SSTI system()"
    stages:
      - input:
